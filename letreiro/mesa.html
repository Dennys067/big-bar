<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0B">
<title>Sua mesa · Big Bar e Prosa</title>
<link rel="icon" href="logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Barlow+Condensed:wght@600;700;800&family=Barlow+Semi+Condensed:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--preto:#0B0B0B;--parede:#14110E;--ambar:#F5A51B;--ambar-tinta:#8E5508;--creme:#F1E8CF;--papel:#EADFC1;--tinta:#1B1713;--vermelho:#B3261E;
  --f-letreiro:"Alfa Slab One","Rockwell Extra Bold",serif;--f-placa:"Barlow Condensed","Arial Narrow",sans-serif;--f-texto:"Barlow Semi Condensed","Arial Narrow",sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--parede);color:var(--creme);font:500 1.05rem/1.4 var(--f-texto);
  padding:env(safe-area-inset-top) 0 calc(1.5rem + env(safe-area-inset-bottom))}
.wrap{max-width:30rem;margin:0 auto;padding:0 1rem}
header{display:flex;align-items:center;gap:.9rem;padding:1rem 0 .6rem}
header img{width:72px;height:72px;border-radius:50%;flex:none}
header .num{font:2.6rem/1 var(--f-letreiro);color:var(--ambar);letter-spacing:.01em}
header .num small{display:block;font:700 .95rem/1 var(--f-placa);color:var(--creme);letter-spacing:.2em;text-transform:uppercase;margin-bottom:.25rem}
.botoes{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin:.6rem 0 1rem}
.bt{appearance:none;border:0;border-radius:14px;padding:1.05rem .6rem .95rem;font:800 1.3rem/1.05 var(--f-placa);text-transform:uppercase;letter-spacing:.06em;
  cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:.45rem;min-height:7.2rem;justify-content:center;touch-action:manipulation}
.bt svg{width:2.3rem;height:2.3rem}
.bt-garcom{background:var(--ambar);color:var(--preto);grid-column:1/-1;min-height:8rem;font-size:1.65rem}
.bt-conta{background:var(--creme);color:var(--tinta)}
.bt-atual{grid-column:1/-1;min-height:4.2rem;flex-direction:row;background:transparent;color:var(--creme);border:2px solid rgba(241,232,207,.35)}
.bt:active{transform:scale(.98)}
.bt[disabled]{opacity:.55;cursor:default}
.aviso{border-radius:12px;padding:.85rem 1rem;margin:0 0 1rem;font-weight:600;display:none}
.aviso.on{display:block}
.aviso.ok{background:#1f3a1d;color:#d9f2cf;border:2px solid #4c8a3f}
.aviso.info{background:#2a2216;color:var(--creme);border:2px solid var(--ambar)}
.aviso.erro{background:#3a1715;color:#ffd9d3;border:2px solid var(--vermelho)}
.comanda{background:var(--papel);color:var(--tinta);border-radius:6px;padding:1.1rem 1rem 1rem;box-shadow:0 10px 30px rgba(0,0,0,.45);position:relative}
.comanda:before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px;
  background:radial-gradient(circle at 8px 8px,var(--parede) 6px,transparent 6.5px) -8px 0/16px 16px repeat-x}
.comanda h2{margin:0 0 .2rem;font:1.35rem/1.1 var(--f-letreiro);color:var(--ambar-tinta)}
.comanda .sub{margin:0 0 .8rem;font-size:.95rem;color:#5a4f40}
.linhas{list-style:none;margin:0;padding:0;border-top:2px dashed #b9a97f}
.linhas li{display:grid;grid-template-columns:2.4rem 1fr auto;gap:.4rem;padding:.55rem 0;border-bottom:1px dashed #cdbf98;align-items:baseline}
.linhas .q{font:800 1.1rem/1 var(--f-placa)}
.linhas .n{font-weight:600}
.linhas .n small{display:block;font-weight:500;color:#5a4f40}
.linhas .v{font:700 1.05rem/1 var(--f-placa);white-space:nowrap}
.tot{margin:.8rem 0 0;display:grid;grid-template-columns:1fr auto;gap:.25rem .5rem;font-weight:600}
.tot .grande{font:1.6rem/1.1 var(--f-letreiro);color:var(--tinta);padding-top:.35rem;border-top:2px solid var(--tinta);margin-top:.3rem}
.vazio{padding:1rem 0 .4rem;text-align:center;color:#5a4f40}
.rodape{margin:1rem 0 0;text-align:center;font-size:.9rem;color:rgba(241,232,207,.7)}
.rodape a{color:var(--ambar)}
.carregando{opacity:.6}
@media (prefers-reduced-motion:no-preference){.bt{transition:transform .08s}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <img src="logo.jpg" alt="Big Bar e Prosa">
    <div class="num" id="titulo"><small>Sua mesa</small>…</div>
  </header>

  <div class="aviso" id="aviso" role="status" aria-live="polite"></div>

  <div class="botoes" id="botoes">
    <button class="bt bt-garcom" id="b-garcom" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
      Chamar garçom
    </button>
    <button class="bt bt-atual" id="b-atual" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
      Atualizar comanda
    </button>
  </div>

  <section class="comanda" id="comanda" aria-labelledby="c-tit">
    <h2 id="c-tit">Sua comanda</h2>
    <p class="sub" id="c-sub">Carregando…</p>
    <ul class="linhas" id="c-linhas"></ul>
    <div class="tot" id="c-tot"></div>
  </section>

  <p class="rodape">Os valores são só para conferir. A conta é fechada com o garçom ou no caixa.<br>
    <a href="./#cardapio">Ver o cardápio</a></p>
</div>

<script src="sb/supabase.js?v=cfaa3cbd"></script>
<script>
(function(){
'use strict';
var SB_URL='https://uwyoosmjnghokpdrmumk.supabase.co',SB_CHAVE='sb_publishable_uGEzmDjXXCcXyUz89nVPcA_GFhCKAj-';
var sb=window.BIG_SB_FAKE||supabase.createClient(SB_URL,SB_CHAVE,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
var q=new URLSearchParams(location.search),mesa=(q.get('m')||'').trim(),token=(q.get('t')||'').trim();
var $=function(id){return document.getElementById(id);};
var BRL=new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'});
function R(c){return BRL.format((c||0)/100);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function cent(v){if(typeof v==='number')return Math.round(v);v=String(v||'').trim().replace(/[^\d,\.]/g,'');if(!v)return 0;
  if(v.indexOf(',')>=0)v=v.replace(/\./g,'').replace(',','.');else if(!/^\d+\.\d{1,2}$/.test(v))v=v.replace(/\./g,'');
  var n=parseFloat(v);return isNaN(n)?0:Math.round(n*100);}
function pad(n){return (n<10?'0':'')+n;}
function hora(){var d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());}
var nomeMesa=mesa==='balcao'?'Balcão':'Mesa '+mesa;
$('titulo').innerHTML='<small>Você está na</small>'+esc(nomeMesa);
document.title=nomeMesa+' · Big Bar e Prosa';

var tAviso=null;
function aviso(txt,tipo,ms){var a=$('aviso');a.textContent=txt;a.className='aviso on '+(tipo||'info');clearTimeout(tAviso);
  if(ms)tAviso=setTimeout(function(){a.className='aviso';},ms);}
function qrRuim(){$('botoes').hidden=true;$('comanda').hidden=true;
  aviso('Esse QR Code não está valendo. Chame o garçom no balcão, por favor.','erro');}

if(!/^[\w-]{1,20}$/.test(mesa)||!/^[\w-]{4,60}$/.test(token)){qrRuim();return;}

var ultimo=null;
function desenha(c){
  if(!c||c.erro){qrRuim();return;}
  var itens=c.itens||[];
  if(c.livre||!itens.length){
    $('c-sub').textContent=c.livre?'Nenhum pedido lançado nesta mesa ainda.':'Mesa aberta às '+(c.aberta||'')+'. Nenhum pedido lançado ainda.';
    $('c-linhas').innerHTML='';$('c-tot').innerHTML='<p class="vazio" style="grid-column:1/-1;margin:0">Peça ao garçom e o pedido aparece aqui.</p>';
  }else{
    var sub=0;
    $('c-linhas').innerHTML=itens.map(function(l){
      var u=(+l.preco||0)+(l.adic||[]).reduce(function(s,a){return s+(+a.preco||0);},0),t=u*(+l.qtd||0);sub+=t;
      var ad=(l.adic||[]).map(function(a){return '+ '+esc(a.nome);}).join(', ');
      return '<li><span class="q">'+esc(l.qtd)+'×</span><span class="n">'+esc(l.nome)+(ad?'<small>'+ad+'</small>':'')+'</span><span class="v">'+R(t)+'</span></li>';
    }).join('');
    var serv=c.servico?Math.round(sub*.1):0,d=c.desc||{},dv=cent(d.v),desc=d.t==='pct'?Math.round(sub*Math.min(dv,10000)/10000):dv;
    desc=Math.min(desc,sub+serv);var tot=sub+serv-desc,pes=Math.max(1,+c.pessoas||1);
    var h='<span>Itens</span><span>'+R(sub)+'</span>';
    if(serv)h+='<span>Serviço (10%)</span><span>'+R(serv)+'</span>';
    if(desc)h+='<span>Desconto</span><span>− '+R(desc)+'</span>';
    h+='<span class="grande">Total</span><span class="grande">'+R(tot)+'</span>';
    if(pes>1)h+='<span>Dividido por '+pes+'</span><span>'+R(Math.ceil(tot/pes))+' cada</span>';
    $('c-tot').innerHTML=h;
    $('c-sub').textContent=(c.aberta?'Aberta às '+c.aberta+'. ':'')+'Atualizado às '+hora()+'.';
  }
  var ch=c.chamado||[];
  var esp=ch.filter(function(x){return x.tipo==='garcom';}).length,cta=ch.filter(function(x){return x.tipo==='conta';}).length;
  /* o aviso verde some sozinho quando o garçom marca que atendeu */
  if(cta)aviso('Você pediu a conta. O garçom já vem trazer.','ok');
  else if(esp)aviso('O garçom foi chamado e já está vindo.','ok');
  else if($('aviso').classList.contains('ok'))$('aviso').className='aviso';
}
var buscando=false;
function busca(){if(buscando)return;buscando=true;$('comanda').classList.add('carregando');
  sb.rpc('comanda_mesa',{m:mesa,t:token}).then(function(r){
    if(r.error)throw r.error;ultimo=r.data;desenha(r.data);
  }).catch(function(){aviso('Sem conexão agora. Tente de novo em instantes.','erro',5000);
  }).then(function(){buscando=false;$('comanda').classList.remove('carregando');});}

function chamar(tipo,b){
  if(b.disabled)return;b.disabled=true;
  sb.rpc('chamar_garcom',{m:mesa,t:token,tipo:tipo}).then(function(r){
    if(r.error)throw r.error;var s=r.data;
    if(s==='ok')aviso(tipo==='conta'?'Pronto! Pedimos a sua conta. O garçom já vem trazer.':'Pronto! Chamamos o garçom. Ele já está vindo.','ok');
    else if(s==='ja')aviso(tipo==='conta'?'A conta já foi pedida. Só um instante.':'O garçom já foi chamado. Só um instante, ele já vem.','ok');
    else if(s==='espera')aviso('Muitos chamados agora. Espere um pouquinho e tente de novo.','info',8000);
    else if(s==='qr'){qrRuim();return;}
    else aviso('Não deu certo. Tente de novo.','erro',6000);
    if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){}
    setTimeout(busca,800);
  }).catch(function(){aviso('Sem conexão agora. Tente de novo em instantes.','erro',6000);
  }).then(function(){setTimeout(function(){b.disabled=false;},4000);});
}
$('b-garcom').addEventListener('click',function(){chamar('garcom',this);});
$('b-atual').addEventListener('click',busca);
busca();
setInterval(function(){if(!document.hidden)busca();},20000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)busca();});
})();
</script>
</body>
</html>
